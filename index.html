<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score: <span id="high_score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00:00</span></h3>
                </div>
            </div>
            <div class="board"></div>
        </section>

        <div class="modal">
            <div class="start-game">
                <h3>WELCOME TO SNAKE GAME</h3>
                <button class="btn btn-start">START GAME</button>
            </div>
            <div class="game-over">
                <h3>GAME OVER</h3>
                <p class="final-score-text">Final Score: <span id="final-score">0</span></p>
                <button class="btn btn-restart">RESTART GAME</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
